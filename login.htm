<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AR Social - Login</title>

<link rel="stylesheet" href="css/style.css">

<style>
body{
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
    background:#f0f2f5;
}

.container{
    width:100%;
    max-width:400px;
    margin:60px auto;
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.1);
}

.logo{
    text-align:center;
    font-size:32px;
    font-weight:bold;
    color:#1877f2;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:8px;
}

button{
    width:100%;
    padding:12px;
    background:#1877f2;
    color:white;
    border:none;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#166fe5;
}

.register-link{
    text-align:center;
    margin-top:15px;
}
</style>

</head>
<body>

<div class="container">

<div class="logo">
AR Social
</div>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button id="loginBtn">
Login
</button>

<div class="register-link">
<a href="register.html">Create New Account</a>
</div>

</div>

<script type="module">

import { loginUser } from "./js/auth.js";

document.getElementById("loginBtn")
.addEventListener("click",()=>{

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

loginUser(email,password);

});

</script>

</body>
</html>
